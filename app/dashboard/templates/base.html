<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - MarketPulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/css/dashboard.css?v=20260916_marketpulse_v1">
  <style>
    :root {
      --primary-green: #0B4F35 !important;
      --deep-green: #073D2A !important;
      --accent-green: #176B49 !important;
      --gold: #B68A2C !important;
      --soft-gold: #C9A84D !important;
      --background: #F8FAF8 !important;
      --surface: #FFFFFF !important;
      --text-main: #17221C !important;
      --text-muted: #68756E !important;
      --border: #E3E9E5 !important;

      --bg-page: #F8FAF8 !important;
      --bg-surface: #FFFFFF !important;
      --text-primary: #17221C !important;
      --text-secondary: #68756E !important;
      --border-light: #E3E9E5 !important;
      --accent-gold: #B68A2C !important;
      --accent-gold-hover: #C9A84D !important;
    }

    .site-header {
      background-color: #FFFFFF !important;
      border-top: none !important;
      border-bottom: 1px solid #E3E9E5 !important;
      box-shadow: 0 1px 4px rgba(7, 61, 42, 0.04) !important;
    }

    .brand-logo {
      height: 48px !important;
      width: 48px !important;
      max-height: 52px !important;
      object-fit: contain !important;
      display: block !important;
      border-radius: 4px !important;
    }

    .brand-title {
      color: #073D2A !important;
      font-size: 1.3rem !important;
      font-weight: 800 !important;
      letter-spacing: 0.06em !important;
      line-height: 1.15 !important;
    }

    .brand-subtitle {
      color: #68756E !important;
      font-size: 0.775rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.04em !important;
      text-transform: uppercase !important;
    }

    .header-accent-line {
      height: 2px !important;
      width: 100% !important;
      background: linear-gradient(90deg, #0B4F35 0%, #B68A2C 40%, transparent 80%) !important;
    }

    .nav-link {
      color: #68756E !important;
      border-bottom: 2.5px solid transparent !important;
      border-radius: 0 !important;
      padding: 0.4rem 0.2rem !important;
    }

    .nav-link:hover {
      color: #0B4F35 !important;
      background-color: transparent !important;
      border-bottom-color: #B68A2C !important;
    }

    .nav-link.active {
      background-color: transparent !important;
      color: #073D2A !important;
      border-bottom: 2.5px solid #0B4F35 !important;
      box-shadow: none !important;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
    }

    .section-header {
      border-bottom: 2px solid #B68A2C !important;
      color: #FFFFFF !important;
    }

    .header-india {
      background: linear-gradient(135deg, #073D2A 0%, #0B4F35 100%) !important;
    }

    .header-domestic {
      background: linear-gradient(135deg, #09422D 0%, #10593B 100%) !important;
    }

    .header-international {
      background: linear-gradient(135deg, #053323 0%, #084730 100%) !important;
    }

    .story-number {
      background-color: #F1F6F3 !important;
      color: #073D2A !important;
      border: 1.5px solid #B68A2C !important;
    }

    .story-headline {
      color: #17221C !important;
    }

    .story-link,
    .archive-link {
      color: #0B4F35 !important;
    }

    .story-link:hover,
    .archive-link:hover {
      color: #B68A2C !important;
    }

    .briefing-banner {
      border-left: 4px solid #0B4F35 !important;
    }

    .briefing-date-title {
      color: #073D2A !important;
    }

    .source-tag {
      color: #073D2A !important;
      background-color: #EDF4F0 !important;
      border: 1px solid #D7E5DD !important;
    }

    .site-footer {
      display: none !important;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-group">
        <a href="/" class="brand-link">
          <img src="/static/images/marketpulse_logo.png" alt="MarketPulse Logo" class="brand-logo">
          <div class="brand-text">
            <h1 class="brand-title">MARKETPULSE</h1>
            <p class="brand-subtitle">Daily Investment Intelligence</p>
          </div>
        </a>
      </div>
      <nav class="nav-links">
        <a href="/" class="nav-link {% if is_latest %}active{% endif %}">Latest Briefing</a>
        <a href="/archive"
          class="nav-link {% if not is_latest and title == 'Briefing Archive' %}active{% endif %}">Archive</a>
      </nav>
    </div>
    <div class="header-accent-line"></div>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
</body>

</html>
