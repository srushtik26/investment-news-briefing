name: Daily Investment Briefing Automation

on:
  schedule:
    - cron: '0 21 * * *'   # 2:30 AM IST every day (primary run)
    - cron: '45 21 * * *'  # 3:15 AM IST every day (automatic recovery run)

  workflow_dispatch:

concurrency:
  group: daily-briefing-execution
  cancel-in-progress: false

jobs:
  run-daily-briefing:
    name: Generate & Deliver Daily Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get current IST date
        id: current-date
        shell: bash
        run: |
          echo "date=$(TZ=Asia/Kolkata date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "Current IST time:"
          TZ=Asia/Kolkata date

      - name: Restore history database cache
        uses: actions/cache@v4
        with:
          path: |
            data/briefings.db
            data/briefing_history.json
          key: briefing-history-${{ steps.current-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            briefing-history-

      - name: Restore daily delivery state cache
        uses: actions/cache@v4
        with:
          path: |
            data/last_email_date.txt
            data/primary_email_date.txt
            data/dashboard_sync_date.txt
            data/briefing_date.txt
            data/final_briefing.txt
            data/final_15_stories.json
            data/copy_paste_briefing.txt
          key: briefing-delivery-${{ steps.current-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            briefing-delivery-${{ steps.current-date.outputs.date }}-

      - name: Generate and email canonical 15-story briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT || secrets.GMAIL_RECIPIENTS }}
          GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS || secrets.GMAIL_RECIPIENT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TZ: Asia/Kolkata
        run: |
          echo "Starting canonical 15-story daily briefing..."
          echo "Current IST time:"
          TZ=Asia/Kolkata date
          python run_daily_15.py

      - name: Sync emailed briefing to dashboard
        if: always()
        env:
          DASHBOARD_DATABASE_URL: ${{ secrets.DASHBOARD_DATABASE_URL }}
          TZ: Asia/Kolkata
        run: |
          SYNC_SUCCESS=false
          if [ -f "data/copy_paste_briefing.txt" ]; then
            echo "Attempting dashboard sync with data/copy_paste_briefing.txt..."
            if python run_dashboard_sync.py --file data/copy_paste_briefing.txt; then
              SYNC_SUCCESS=true
            else
              echo "copy_paste briefing invalid or sync failed; falling back to final_briefing.txt"
            fi
          fi

          if [ "$SYNC_SUCCESS" != "true" ]; then
            if [ -f "data/final_briefing.txt" ]; then
              echo "Attempting dashboard sync with data/final_briefing.txt..."
              if python run_dashboard_sync.py --file data/final_briefing.txt; then
                SYNC_SUCCESS=true
              else
                echo "final_briefing sync failed"
              fi
            else
              echo "No valid dashboard briefing artifact found"
            fi
          fi

          if [ "$SYNC_SUCCESS" != "true" ]; then
            echo "ERROR: Dashboard sync failed for all candidate artifacts."
            exit 1
          fi

      - name: Save history database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/briefings.db
            data/briefing_history.json
          key: briefing-history-${{ steps.current-date.outputs.date }}-${{ github.run_id }}

      - name: Save daily delivery state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/last_email_date.txt
            data/primary_email_date.txt
            data/dashboard_sync_date.txt
            data/briefing_date.txt
            data/final_briefing.txt
            data/final_15_stories.json
            data/copy_paste_briefing.txt
          key: briefing-delivery-${{ steps.current-date.outputs.date }}-${{ github.run_id }}

      - name: Upload briefing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-artifacts-${{ steps.current-date.outputs.date }}-${{ github.run_id }}
          path: |
            data/final_briefing.txt
            data/copy_paste_briefing.txt
            data/final_15_stories.json
            data/briefing_date.txt
            data/last_email_date.txt
            data/primary_email_date.txt
            data/dashboard_sync_date.txt
            data/pipeline_execution_log.txt
          retention-days: 14
          if-no-files-found: ignore
