name: Daily Investment Briefing Automation

on:
  schedule:
    # Run every day at 07:00 AM IST
    - cron: '0 7 * * *'
      timezone: 'Asia/Kolkata'

  workflow_dispatch:

concurrency:
  group: daily-briefing-execution
  cancel-in-progress: false

jobs:
  run-daily-briefing:
    name: Generate & Deliver Daily Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get current IST date
        id: current-date
        shell: bash
        run: |
          echo "date=$(TZ=Asia/Kolkata date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "Current IST time:"
          TZ=Asia/Kolkata date

      - name: Restore delivery state cache
        uses: actions/cache@v4
        with:
          path: data/last_email_date.txt
          key: daily-email-state-${{ steps.current-date.outputs.date }}

      - name: Execute daily briefing pipeline and email delivery
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT || secrets.GMAIL_RECIPIENTS }}
          GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS || secrets.GMAIL_RECIPIENT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DASHBOARD_DATABASE_URL: ${{ secrets.DASHBOARD_DATABASE_URL }}
          TZ: Asia/Kolkata
        run: |
          echo "Starting daily briefing..."
          echo "Current IST time:"
          TZ=Asia/Kolkata date
          python run_daily.py
          python run_dashboard_sync.py --file data/copy_paste_briefing.txt

      - name: Save delivery state cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/last_email_date.txt
          key: daily-email-state-${{ steps.current-date.outputs.date }}
